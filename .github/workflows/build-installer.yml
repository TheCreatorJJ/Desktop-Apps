name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "pomodoro/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

jobs:
  build:
    name: NSIS installer (windows x64)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: pomodoro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pomodoro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = "dist/Pomodoro Setup 1.0.0.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            Write-Error "Installer not found at $installer"
            Get-ChildItem -Recurse -LiteralPath dist | Select-Object FullName, Length
            exit 1
          }
          $item = Get-Item -LiteralPath $installer
          Write-Host "OK: $($item.FullName) ($([math]::Round($item.Length / 1MB, 1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-Setup-1.0.0
          path: |
            pomodoro/dist/Pomodoro Setup 1.0.0.exe
            pomodoro/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30